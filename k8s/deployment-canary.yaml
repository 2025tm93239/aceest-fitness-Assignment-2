---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: stable
    spec:
      containers:
        - name: web
          image: aceest-fitness:stable
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary
    spec:
      containers:
        - name: web
          image: aceest-fitness:canary
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-only
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    track: canary
  ports:
    - port: 80
      targetPort: 5000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-fitness
      deployment: rolling
  template:
    metadata:
      labels:
        app: aceest-fitness
        deployment: rolling
    spec:
      containers:
        - name: web
          image: aceest-fitness:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "2.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      ab: variant-a
  template:
    metadata:
      labels:
        app: aceest-fitness
        ab: variant-a
    spec:
      containers:
        - name: web
          image: aceest-fitness:variant-a
          env:
            - name: APP_VERSION
              value: "A"
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-b
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      ab: variant-b
  template:
    metadata:
      labels:
        app: aceest-fitness
        ab: variant-b
    spec:
      containers:
        - name: web
          image: aceest-fitness:variant-b
          env:
            - name: APP_VERSION
              value: "B"
          ports:
            - containerPort: 5000
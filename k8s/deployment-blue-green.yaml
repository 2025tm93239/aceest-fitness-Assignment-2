# Blue = live traffic (service points here). Green = new release; switch selector after test.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      color: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        color: blue
    spec:
      containers:
        - name: web
          image: aceest-fitness:stable
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      color: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        color: green
    spec:
      containers:
        - name: web
          image: aceest-fitness:candidate
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue-green
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    color: blue
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081